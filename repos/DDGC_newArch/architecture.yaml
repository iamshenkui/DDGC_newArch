required_paths:
  - path: frontend/src/screens/startup/StartupScreen.test.tsx
    role: Unit validation that the first-combat demo entry launches from startup.
  - path: frontend/src/screens/combat/CombatScreen.test.tsx
    role: Unit validation that the first-combat fixture renders the migrated combat screen and stays interactive.
  - path: frontend/src/bridge
    role: RuntimeBridge seam used by the demo entry and combat interactions.
  - path: frontend/src/validation
    role: Fixture and bridge contract validation surfaces used by tests.
  - path: repos/DDGC_newArch/architecture.yaml
    role: This architecture boundary artifact.

acceptance_criteria:
  - |
    cd frontend && npm run typecheck passes with no TypeScript errors.
  - |
    cd frontend && npm run test passes the full Vitest suite, including the new
    StartupScreen and CombatScreen first-combat fixture tests.
  - |
    cd frontend && npm run build produces a production bundle.
  - |
    A focused browser smoke command proves the first-combat demo renders non-blank
    through the existing app:
      cd frontend && npm run build && npx playwright test smoke/firstCombatDemo.spec.ts
  - |
    Test evidence confirms the rendered view is the existing migrated combat screen
    (.combat-viewport with title "初战：苍灯林地") and not a new isolated page.

validation:
  typecheck_command: cd frontend && npm run typecheck
  test_command: cd frontend && npm run test
  build_command: cd frontend && npm run build
  browser_smoke_command: cd frontend && npm run build && npx playwright test smoke/firstCombatDemo.spec.ts

