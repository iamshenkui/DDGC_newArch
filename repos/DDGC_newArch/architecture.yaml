implementation_evidence:
  cartographer_30_checkpoint:
    - StartupScreen.test.tsx asserts the First Combat Demo button is present and clickable.
    - CombatScreen.test.tsx asserts the first-combat fixture renders party, enemies, skills, and a usable Confirm Attack interaction.
    - firstCombatDemo.spec.ts provides a browser-level proof that the demo renders the existing CombatScreen end-to-end.
    - architecture.yaml records scope, required paths, acceptance criteria, and exact validation commands.

  quartermaster_pre_merge:
    - Typecheck passes.
    - Full Vitest suite passes.
    - Production build succeeds.
    - Focused browser smoke command is documented and runnable.
    - Default startup/replay/live/campaign flows remain intact.
    - No isolated demo route or unrelated art introduced.
    - Blockers explicitly recorded rather than hidden.
