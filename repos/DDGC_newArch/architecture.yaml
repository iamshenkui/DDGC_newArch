implementation_evidence:
  cartographer_30_checkpoint:
    - StartupScreen exposes a First Combat Demo menu button.
    - DdgcApp wires the entry to a replay bridge and dispatches start-first-combat-demo.
    - ReplayRuntimeBridge resolves the intent to replayFirstCombatViewModel (flowState=combat).
    - FlowController allows the transition from startup/loading/town.
    - architecture.yaml in place with M4 scope and boundary.

  quartermaster_pre_merge:
    - Typecheck passes.
    - Full test suite passes.
    - Default startup/replay/live/campaign flows remain intact.
    - No isolated demo route or unrelated art introduced.
    - Blockers explicitly recorded rather than hidden.
