dependencies:
  - source: ReplayRuntimeBridge
    target: replayFixtures
    relationship: imports
    detail: |
      ReplayRuntimeBridge imports replayFirstCombatViewModel from
      frontend/src/validation/replayFixtures.ts to serve the
      start-first-combat-demo intent.

  - source: LiveRuntimeBridge
    target: replayFixtures
    relationship: imports
    detail: |
      LiveRuntimeBridge imports replayFirstCombatViewModel from
      frontend/src/validation/replayFixtures.ts to serve the same demo intent,
      demonstrating the fixture is backend-agnostic at the RuntimeBridge seam.

  - source: ReplayRuntimeBridge
    target: FlowController
    relationship: uses
    detail: |
      ReplayRuntimeBridge calls canTransition for guarded intents including
      start-first-combat-demo.

  - source: LiveRuntimeBridge
    target: FlowController
    relationship: uses
    detail: |
      LiveRuntimeBridge calls canTransition for guarded intents including
      start-first-combat-demo.

  - source: FlowController
    target: contractTypes
    relationship: imports
    detail: |
      FlowController imports DdgcFrontendSnapshot, DdgcFrontendIntent, and
      view-model types from frontend/src/bridge/contractTypes.ts.

  - source: DdgcApp
    target: ReplayRuntimeBridge
    relationship: instantiates
    detail: |
      DdgcApp creates a ReplayRuntimeBridge when runtime mode is replay.

  - source: DdgcApp
    target: LiveRuntimeBridge
    relationship: instantiates
    detail: |
      DdgcApp creates a LiveRuntimeBridge when runtime mode is live.

  - source: DdgcApp
    target: FlowController
    relationship: uses
    detail: |
      DdgcApp uses resolveScreen from FlowController to select the active screen.

  - source: DdgcApp
    target: CombatScreen
    relationship: renders
    detail: |
      When snapshot.viewModel.kind === "combat", DdgcApp renders CombatScreen
      with the CombatViewModel emitted by the bridge.

  - source: CombatScreen
    target: contractTypes
    relationship: imports
    detail: |
      CombatScreen imports CombatViewModel from contractTypes.

  - source: CombatScreen
    target: originalAssetPaths
    relationship: uses
    detail: |
      CombatScreen calls resolveHeroPortrait for optional portraits; unresolved
      assets fall back to class-label initials.

